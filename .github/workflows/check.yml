name: Reproduction pipeline check
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.1'
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: julia --project=. test/runtests.jl
      - run: julia --project=. scripts/generate_data.jl --smoke --data-dir smoke-data
      - run: julia --project=. scripts/plot_figures.jl --smoke --data-dir smoke-data --output-dir smoke-figures
      - run: julia --project=. scripts/generate_data.jl --smoke --figures supp-stability --data-dir supp-smoke-data
      - run: julia --project=. scripts/plot_figures.jl --smoke --figures supp-stability --data-dir supp-smoke-data --output-dir supp-smoke-figures
